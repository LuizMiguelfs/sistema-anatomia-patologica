# CI do SAP (T6.1): todo PR e todo push na main rodam os testes, o build e o auditor do framework.
# Um PR com teste quebrado, build quebrado ou auditor abaixo de 11/11 fica vermelho.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest e auditor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar Python e dependencias (versoes travadas no uv.lock)
        run: uv sync --frozen

      - name: Testes do backend
        run: uv run pytest -q

      - name: Auditor do framework (exige 11/11)
        run: |
          uv run python audit_framework.py . | tee auditoria.txt
          if grep -qF "[ FAIL ]" auditoria.txt; then
            echo "::error::O auditor do framework encontrou item reprovado (veja o [ FAIL ] acima)."
            exit 1
          fi

  frontend:
    name: Frontend (testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (versoes travadas no package-lock.json)
        run: npm ci

      - name: Testes do frontend
        run: npm test

      - name: Build (inclui a checagem de tipos do vue-tsc)
        run: npm run build